<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' data: blob:">
  <title>PlotTwist — Untitled</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">PlotTwist</span>
      <span class="brand-tagline">seating layout calculator</span>
    </div>
  </header>

  <div class="app-grid">
    <aside id="sidebar" class="pane sidebar-pane"></aside>
    <section class="canvas-column">
      <div id="toolbar" class="pane toolbar-pane"></div>
      <div id="canvas"  class="pane canvas-pane"></div>
    </section>
    <aside class="pane right-pane">
      <div id="layers" class="layers-host"></div>
      <div id="info"   class="info-host"></div>
    </aside>
  </div>

  <footer class="vep-footer">
    <span class="copyright">© 2026 Visual Entropy Productions</span>
    <a class="vep-link" href="https://veproductions.net" target="_blank" rel="noopener">veproductions.net</a>
  </footer>

  <script src="vendor/polygon-clipping/polygon-clipping.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
