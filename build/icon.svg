<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <!-- Background: rounded navy tile so icon reads well in dock / taskbar. -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="#070910"/>

  <!-- 8×8 graph-paper grid (32px step). -->
  <g opacity="0.55" stroke="#2a3147" stroke-width="2">
    <line x1="0" y1="0" x2="0" y2="256"/>
    <line x1="32" y1="0" x2="32" y2="256"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="96" y1="0" x2="96" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="160" y1="0" x2="160" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
    <line x1="224" y1="0" x2="224" y2="256"/>
    <line x1="256" y1="0" x2="256" y2="256"/>
    <line x1="0" y1="0" x2="256" y2="0"/>
    <line x1="0" y1="32" x2="256" y2="32"/>
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="96" x2="256" y2="96"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="160" x2="256" y2="160"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="0" y1="224" x2="256" y2="224"/>
    <line x1="0" y1="256" x2="256" y2="256"/>
  </g>

  <!-- Faint magenta XY axes through (128, 128). -->
  <line x1="14" y1="128" x2="242" y2="128" stroke="#FF2D9D" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <line x1="128" y1="14" x2="128" y2="242" stroke="#FF2D9D" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- Three classroom tables with chair pips below (audience faces up). -->
  <!-- Row 1: y=84 -->
  <rect x="80" y="84" width="96" height="14" rx="2" fill="#FF2D9D"/>
  <g fill="#FF2D9D">
    <rect x="84"  y="100" width="13" height="8" rx="2"/>
    <rect x="101" y="100" width="13" height="8" rx="2"/>
    <rect x="118" y="100" width="13" height="8" rx="2"/>
    <rect x="135" y="100" width="13" height="8" rx="2"/>
    <rect x="152" y="100" width="13" height="8" rx="2"/>
  </g>
  <!-- Row 2: y=124 -->
  <rect x="80" y="124" width="96" height="14" rx="2" fill="#FF2D9D"/>
  <g fill="#FF2D9D">
    <rect x="84"  y="140" width="13" height="8" rx="2"/>
    <rect x="101" y="140" width="13" height="8" rx="2"/>
    <rect x="118" y="140" width="13" height="8" rx="2"/>
    <rect x="135" y="140" width="13" height="8" rx="2"/>
    <rect x="152" y="140" width="13" height="8" rx="2"/>
  </g>
  <!-- Row 3: y=164 -->
  <rect x="80" y="164" width="96" height="14" rx="2" fill="#FF2D9D"/>
  <g fill="#FF2D9D">
    <rect x="84"  y="180" width="13" height="8" rx="2"/>
    <rect x="101" y="180" width="13" height="8" rx="2"/>
    <rect x="118" y="180" width="13" height="8" rx="2"/>
    <rect x="135" y="180" width="13" height="8" rx="2"/>
    <rect x="152" y="180" width="13" height="8" rx="2"/>
  </g>

  <!-- Marquee: dashed magenta square (the room outline). -->
  <polygon points="64,64 192,64 192,192 64,192"
           fill="none" stroke="#FF2D9D" stroke-width="7"
           stroke-linejoin="round" stroke-linecap="round"
           stroke-dasharray="10 6"/>

  <!-- Three vertex handles (square, navy-fill ringed in magenta). -->
  <rect x="55" y="55" width="18" height="18" fill="#0a0d16" stroke="#FF2D9D" stroke-width="3"/>
  <rect x="183" y="183" width="18" height="18" fill="#0a0d16" stroke="#FF2D9D" stroke-width="3"/>
  <rect x="55" y="183" width="18" height="18" fill="#0a0d16" stroke="#FF2D9D" stroke-width="3"/>

  <!-- Active vertex: filled magenta circle at top-right (the twist). -->
  <circle cx="192" cy="64" r="14" fill="#FF2D9D"/>
</svg>
